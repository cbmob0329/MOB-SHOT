 <!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>MOB SHOT</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <section id="mainScreen" class="screen active">
      <div class="main-bg"></div>

      <div class="main-top">
        <img id="titleImg" class="title-img" src="mt/menutitle.png" alt="MOB SHOT" />
        <div class="fallback-title">MOB<br>SHOT</div>
      </div>

      <div class="main-status">
        <div class="status-pill">
          <span class="icon diamond"></span>
          <span id="mainDiamond">0</span>
        </div>
        <div class="status-pill">
          <span class="icon rank">R</span>
          <span id="mainRank">1</span>
        </div>
        <div class="status-pill">
          <span class="icon coin"></span>
          <span id="mainCoin">0</span>
        </div>
      </div>

      <div class="player-showcase">
        <div class="player-glow"></div>
        <img id="mainPlayer" src="play/playpink2.png" alt="PLAYER" />
        <div class="fallback-player">MOB</div>
        <div id="mainPetFloatLayer" class="main-pet-float-layer"></div>
      </div>

      <section id="petEquipPanel" class="pet-equip-panel">
        <div class="pet-equip-title">PET</div>
        <div id="petEquipSlots" class="pet-equip-slots"></div>
      </section>

      <nav class="right-menu">
        <button id="sortieBtn" class="image-button sortie" type="button">
          <img id="sortieImg" src="mt/menusta.png" alt="出撃" />
          <span>出撃</span>
        </button>

        <button id="openShopBtn" class="image-button" type="button">
          <img id="shopImg" src="mt/menushop.png" alt="SHOP" />
          <span>SHOP</span>
        </button>

        <button id="openEquipBtn" class="image-button" type="button">
          <img id="equipImg" src="mt/menusoubi.png" alt="装備" />
          <span>装備</span>
        </button>

        <button id="openPetEquipBtn" class="image-button" type="button">
          <img id="petImg" src="mt/menupet.png" alt="ペット" />
          <span>ペット</span>
        </button>
      </nav>

      <nav class="bottom-menu">
        <button class="bottom-button disabled-btn" type="button">
          <img id="gachaImg" src="mt/menugacha.png" alt="ガチャ" />
          <span>ガチャ</span>
        </button>

        <button id="openMissionBtn" class="bottom-button" type="button">
          <img id="missionImg" src="mt/menumission.png" alt="ミッション" />
          <span>ミッション</span>
        </button>

        <button class="bottom-button disabled-btn" type="button">
          <img id="collectionImg" src="mt/menucolle.png" alt="コレクション" />
          <span>コレクション</span>
        </button>
      </nav>

      <div id="shopModal" class="shop-modal hidden">
        <div class="shop-modal-card">
          <div class="shop-modal-head">
            <h2>SHOP</h2>
            <button id="shopCloseBtn" type="button">閉じる</button>
          </div>

          <div class="shop-tabs">
            <button id="shopTabAvatar" class="shop-tab active" type="button">アバター</button>
            <button id="shopTabRecord" class="shop-tab" type="button">レコード</button>
            <button id="shopTabUpgrade" class="shop-tab" type="button">強化</button>
          </div>

          <p id="shopHelpText" class="shop-help">
            アイテム購入と強化ができます。装備は装備メニューで行います。
          </p>

          <div id="shopList" class="shop-list"></div>
        </div>
      </div>

      <div id="equipModal" class="equip-modal hidden">
        <div class="equip-modal-card">
          <div class="equip-modal-head">
            <h2>装備</h2>
            <button id="equipCloseBtn" type="button">閉じる</button>
          </div>

          <div class="equip-tabs">
            <button id="equipTabAvatar" class="equip-tab active" type="button">アバター</button>
            <button id="equipTabRecord" class="equip-tab" type="button">レコード</button>
            <button id="equipTabSkill" class="equip-tab" type="button">スキル</button>
          </div>

          <p id="equipHelpText" class="equip-help">
            所持しているアイテムを装備できます。
          </p>

          <div id="equipList" class="equip-list"></div>
        </div>
      </div>

      <div id="missionModal" class="mission-modal hidden">
        <div class="mission-modal-card">
          <div class="mission-modal-head">
            <h2>ミッション</h2>
            <button id="missionCloseBtn" type="button">閉じる</button>
          </div>

          <div class="mission-tabs">
            <button id="missionTabStage" class="mission-tab active" type="button">ステージ</button>
            <button id="missionTabDestroy" class="mission-tab" type="button">撃破</button>
            <button id="missionTabGate" class="mission-tab" type="button">ゲート</button>
            <button id="missionTabRank" class="mission-tab" type="button">ランク</button>
            <button id="missionTabCoin" class="mission-tab" type="button">コイン</button>
          </div>

          <p id="missionHelpText" class="mission-help">
            条件達成後に「受け取る」で報酬を獲得できます。
          </p>

          <div id="missionList" class="mission-list"></div>
        </div>
      </div>

      <div id="petEquipModal" class="pet-modal hidden">
        <div class="pet-modal-card">
          <div class="pet-modal-head">
            <h2>ペット装備</h2>
            <button id="petModalCloseBtn" type="button">閉じる</button>
          </div>

          <p class="pet-modal-help">
            ペットを購入・強化・装備できます。最大3体まで装備可能です。
          </p>

          <div id="petOwnedList" class="pet-owned-list"></div>
        </div>
      </div>
    </section>

    <section id="gameScreen" class="screen">
      <canvas id="gameCanvas"></canvas>

      <div class="game-hud">
        <div class="hud-item">
          <img id="hudStageImg" src="mt/stagestage.png" alt="STAGE" />
          <span id="hudStage">1-1</span>
        </div>

        <div class="hud-item">
          <img id="hudScoreImg" src="mt/stagescore.png" alt="SCORE" />
          <span id="hudScore">0</span>
        </div>

        <div class="hud-item">
          <img id="hudCoinImg" src="mt/stagecoin.png" alt="COIN" />
          <span id="hudCoin">0</span>
        </div>

        <div class="hud-item">
          <img id="hudLifeImg" src="mt/stagelife.png" alt="LIFE" />
          <span id="hudLife">50</span>
        </div>
      </div>

      <div id="phaseBanner" class="phase-banner"></div>

      <button id="gameBackBtn" class="back-btn" type="button">メインへ</button>

      <div id="skillHud" class="skillHud">
        <div class="skillSlot" id="skillSlot0">
          <img id="skillSlotImg0" alt="SKILL 1" />
          <div id="skillCd0" class="skillCd hidden"></div>
        </div>

        <div class="skillSlot" id="skillSlot1">
          <img id="skillSlotImg1" alt="SKILL 2" />
          <div id="skillCd1" class="skillCd hidden"></div>
        </div>

        <div class="skillSlot" id="skillSlot2">
          <img id="skillSlotImg2" alt="SKILL 3" />
          <div id="skillCd2" class="skillCd hidden"></div>
        </div>
      </div>

      <div id="resultPanel" class="result-panel hidden">
        <div class="result-card">
          <h1 id="resultTitle">CLEAR!</h1>
          <p id="resultText">ボス撃破！ステージクリア</p>

          <div class="result-row">
            <span>SCORE</span>
            <b id="resultScore">0</b>
          </div>

          <div class="result-row">
            <span>COIN</span>
            <b id="resultCoin">0</b>
          </div>

          <button id="resultRetryBtn" type="button">もう一度</button>
          <button id="resultHomeBtn" type="button">メインへ戻る</button>
        </div>
      </div>
    </section>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/stage-flow.js"></script>

  <script src="js/pets.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/equip.js"></script>
  <script src="js/mission.js"></script>

  <script src="js/game-pets.js"></script>
  <script src="js/game-skills.js"></script>
  <script src="js/game-boss.js"></script>
  <script src="js/game-spawn.js"></script>
  <script src="js/game-combat.js"></script>
  <script src="js/game-render.js"></script>
  <script src="js/game.js"></script>

  <script src="js/main.js"></script>
</body>
</html>
